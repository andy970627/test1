# 規格第 30 節：每次 push／PR 跑規則測試；對 main 的 PR、推到 main、手動執行時跑 Unity 測試、建 WebGL 並（設好的話）上傳 itch.io。
# 2026-11-09：加路徑過濾——只改 docs/ 或網頁原型時不跑 Unity（每次約 25 分鐘）；網頁原型與遙測的 Node 測試另外一個工作，每次都跑（約 30 秒）。推到 main 與手動執行一律全跑。
# 密鑰與 itch.io 設定步驟：docs/ci-setup.md
name: CI

on:
  push:
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # 哪些路徑有改：unity＝主線 Unity 專案與 C# 測試；web＝網頁原型與工具。推到 main、手動執行時兩者都當成有改。
  changes:
    name: 判斷改了什麼
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # 11/10：pull_request 事件時 paths-filter 要讀 PR 的檔案清單，沒給權限會報 Resource not accessible by integration
    permissions:
      contents: read
      pull-requests: read
    # 11/12：PR 有新推送（synchronize）時只看「這次推送」改了什麼；原本比整個 PR 對 main，
    # 這個 PR 動過 Unity 檔，結果每推一次都跑約 25 分鐘的 Unity，把 Actions 額度用完。
    outputs:
      unity: ${{ (steps.d.outcome == 'success' && steps.d.outputs.unity == 'true') || (steps.d.outcome != 'success' && steps.f.outputs.unity == 'true') || github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main' }}
      web: ${{ (steps.d.outcome == 'success' && steps.d.outputs.web == 'true') || (steps.d.outcome != 'success' && steps.f.outputs.web == 'true') || github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main' }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: PR 新推送：只看這次推送改的檔
        id: d
        if: github.event_name == 'pull_request' && github.event.action == 'synchronize'
        continue-on-error: true   # 找不到上一次的提交（例如強制推送）時，退回整個 PR 的比較
        env:
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.event.pull_request.head.sha }}
        run: |
          files=$(git diff --name-only "$BEFORE" "$AFTER")
          echo "$files"
          if echo "$files" | grep -qE '^(Assets/|Packages/|ProjectSettings/|tools/CoreTests/|tools/NightSim/|tools/NightSimTests/|tools/playtest/|\.github/workflows/)'; then echo "unity=true" >> "$GITHUB_OUTPUT"; else echo "unity=false" >> "$GITHUB_OUTPUT"; fi
          if echo "$files" | grep -qE '^(prototypes/|tools/telemetry/|tools/playtest-recorder/|tools/build-itch\.|tools/smoke-full\.mjs|\.github/workflows/)'; then echo "web=true" >> "$GITHUB_OUTPUT"; else echo "web=false" >> "$GITHUB_OUTPUT"; fi
      - uses: dorny/paths-filter@v3
        if: steps.d.outcome != 'success'
        id: f
        with:
          filters: |
            unity:
              - 'Assets/**'
              - 'Packages/**'
              - 'ProjectSettings/**'
              - 'tools/CoreTests/**'
              - 'tools/NightSim/**'
              - 'tools/NightSimTests/**'
              - 'tools/playtest/**'
              - '.github/workflows/**'
            web:
              - 'prototypes/**'
              - 'tools/telemetry/**'
              - 'tools/playtest-recorder/**'
              - 'tools/build-itch.*'
              - 'tools/smoke-full.mjs'
              - '.github/workflows/**'

  # 網頁原型與遙測的規則測試（Node，約 30 秒）
  web-tests:
    name: 網頁原型測試（Node）
    needs: changes
    if: needs.changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test prototypes/*/*.test.js prototypes/odyssey-series/*.test.js tools/telemetry/*.test.js
      - name: 打包檢查（相對連結）
        run: bash tools/build-itch.sh | tail -5
      # 11/17：整關冒煙——打包出的站台每一頁用無頭 Chromium 開 3 秒，主控台錯誤、例外、404 就失敗（約 1～2 分鐘）
      - name: 安裝 Playwright（冒煙用）
        run: |
          npm install --no-save --prefix "$RUNNER_TEMP/pw" playwright@1.49.1
          npx --prefix "$RUNNER_TEMP/pw" playwright install --with-deps chromium
      - name: 整關冒煙測試
        run: NODE_PATH="$RUNNER_TEMP/pw/node_modules" node tools/smoke-full.mjs --root dist/odyssey-series --md smoke.md
      - name: 冒煙表寫進執行摘要
        if: always()
        run: cat smoke.md >> "$GITHUB_STEP_SUMMARY" || true

  core-tests:
    name: 規則測試（Odyssey.Core）
    needs: changes
    if: needs.changes.outputs.unity == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - run: dotnet test tools/CoreTests --logger "console;verbosity=normal"
      - name: 模擬器測試（tools/NightSim）
        run: dotnet test tools/NightSimTests --logger "console;verbosity=normal"

  # 同一批測試改在真的 Unity 裡跑：多抓 Unity 編譯器（C# 版本較舊）才會報的錯，以及整個專案（含 MonoBehaviour、Editor 腳本）的編譯錯誤。
  unity-tests:
    name: Unity 測試（EditMode）
    needs: [changes, core-tests]
    if: needs.changes.outputs.unity == 'true' && (github.event_name != 'push' || github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      HAS_UNITY: ${{ secrets.UNITY_LICENSE != '' && secrets.UNITY_EMAIL != '' && secrets.UNITY_PASSWORD != '' }}
    steps:
      - name: 檢查 Unity 授權
        if: env.HAS_UNITY != 'true'
        run: echo "::notice::還沒設定 UNITY_LICENSE／UNITY_EMAIL／UNITY_PASSWORD，略過 Unity 測試（見 docs/ci-setup.md）。"

      # Unity 6 的 Docker 映像很大，GitHub 預設的執行機磁碟放不下（no space left on device）：
      # 先刪掉這個工作用不到的預裝工具（Android SDK、.NET、Haskell、CodeQL 與舊 Docker 映像）。
      - name: 騰出磁碟空間
        if: env.HAS_UNITY == 'true'
        run: |
          df -h /
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          sudo docker image prune --all --force
          df -h /

      - uses: actions/checkout@v4
        if: env.HAS_UNITY == 'true'

      - uses: actions/cache@v4
        if: env.HAS_UNITY == 'true'
        with:
          path: Library
          key: Library-EditMode-${{ hashFiles('Assets/**', 'Packages/**', 'ProjectSettings/**') }}
          restore-keys: |
            Library-EditMode-

      # 釘在 v4.3.2：浮動的 @v4 已移到 v4.4.0，改用新的 game-ci CLI 後 .ulf 授權啟用會失敗
      # （Code 400 TimeStamp validation failed，game-ci/unity-test-runner#336）。
      - uses: game-ci/unity-test-runner@v4.3.2
        id: unity-tests
        if: env.HAS_UNITY == 'true'
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          unityVersion: 6000.3.14f1
          testMode: editmode

      - uses: actions/upload-artifact@v4
        if: always() && env.HAS_UNITY == 'true'
        with:
          name: Unity-TestResults
          path: ${{ steps.unity-tests.outputs.artifactsPath }}
          retention-days: 14

  webgl:
    name: 網頁版建置
    needs: [changes, unity-tests]
    if: needs.changes.outputs.unity == 'true' && (github.event_name != 'push' || github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      HAS_UNITY: ${{ secrets.UNITY_LICENSE != '' && secrets.UNITY_EMAIL != '' && secrets.UNITY_PASSWORD != '' }}
      HAS_ITCH: ${{ secrets.BUTLER_API_KEY != '' && vars.ITCH_GAME != '' }}
    steps:
      - name: 檢查 Unity 授權
        if: env.HAS_UNITY != 'true'
        run: echo "::notice::還沒設定 UNITY_LICENSE／UNITY_EMAIL／UNITY_PASSWORD，略過網頁版建置（見 docs/ci-setup.md）。"

      # Unity 6 的 Docker 映像很大，GitHub 預設的執行機磁碟放不下（no space left on device）：
      # 先刪掉這個工作用不到的預裝工具（Android SDK、.NET、Haskell、CodeQL 與舊 Docker 映像）。
      - name: 騰出磁碟空間
        if: env.HAS_UNITY == 'true'
        run: |
          df -h /
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          sudo docker image prune --all --force
          df -h /

      - uses: actions/checkout@v4
        if: env.HAS_UNITY == 'true'

      - uses: actions/cache@v4
        if: env.HAS_UNITY == 'true'
        with:
          path: Library
          key: Library-WebGL-${{ hashFiles('Assets/**', 'Packages/**', 'ProjectSettings/**') }}
          restore-keys: |
            Library-WebGL-

      # 釘在確切版本，避免浮動的 @v4 像 unity-test-runner 一樣突然換成新 CLI。
      - uses: game-ci/unity-builder@v4.8.2
        if: env.HAS_UNITY == 'true'
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          unityVersion: 6000.3.14f1
          targetPlatform: WebGL
          buildMethod: OdysseyCiBuild.BuildWebGL

      - uses: actions/upload-artifact@v4
        if: env.HAS_UNITY == 'true'
        with:
          name: BlindCave-WebGL
          path: build/WebGL/WebGL
          retention-days: 14

      - name: 上傳 itch.io
        if: env.HAS_UNITY == 'true' && env.HAS_ITCH == 'true'
        env:
          BUTLER_API_KEY: ${{ secrets.BUTLER_API_KEY }}
          ITCH_GAME: ${{ vars.ITCH_GAME }}
        run: |
          curl -sSLf -o butler.zip https://broth.itch.zone/butler/linux-amd64/LATEST/archive/default
          unzip -q butler.zip -d butler && chmod +x butler/butler
          ./butler/butler push build/WebGL/WebGL "$ITCH_GAME:web" --userversion "${GITHUB_SHA::7}"

      - name: 沒設 itch.io
        if: env.HAS_UNITY == 'true' && env.HAS_ITCH != 'true'
        run: echo "::notice::還沒設定 BUTLER_API_KEY 密鑰或 ITCH_GAME 變數，只產出 GitHub 成品 BlindCave-WebGL。"

  # 自動畫面測試（規格第 31 節之後的試玩代理）：用 Playwright 開剛建好的網頁版，
  # 逐一跳到每個情況（?playtest=名稱）截圖、錄影、抓瀏覽器例外；結果在成品 Playtest-Screens。
  playtest:
    name: 自動畫面測試
    needs: [changes, webgl]
    # 網頁版建好、只有 itch.io 上傳失敗時（例如帳號 email 還沒驗證），照樣測畫面。
    if: ${{ !cancelled() && needs.changes.outputs.unity == 'true' && (github.event_name != 'push' || github.ref == 'refs/heads/main') }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      HAS_UNITY: ${{ secrets.UNITY_LICENSE != '' && secrets.UNITY_EMAIL != '' && secrets.UNITY_PASSWORD != '' }}
    steps:
      - name: 檢查 Unity 授權
        if: env.HAS_UNITY != 'true'
        run: echo "::notice::沒有 Unity 授權就沒有網頁版，略過自動畫面測試（見 docs/ci-setup.md）。"

      - uses: actions/checkout@v4
        if: env.HAS_UNITY == 'true'

      - uses: actions/download-artifact@v4
        if: env.HAS_UNITY == 'true'
        with:
          name: BlindCave-WebGL
          path: build

      - uses: actions/setup-node@v4
        if: env.HAS_UNITY == 'true'
        with:
          node-version: '20'

      - name: 安裝 Playwright
        if: env.HAS_UNITY == 'true'
        working-directory: tools/playtest
        run: |
          npm install --no-save playwright@1.49.1
          npx playwright install --with-deps chromium

      - name: 跑自動畫面測試
        if: env.HAS_UNITY == 'true'
        run: node tools/playtest/playtest.js --build build --out playtest-out

      - name: 結果寫進執行摘要
        if: always() && env.HAS_UNITY == 'true'
        run: cat playtest-out/summary.md >> "$GITHUB_STEP_SUMMARY" || true

      - uses: actions/upload-artifact@v4
        if: always() && env.HAS_UNITY == 'true'
        with:
          name: Playtest-Screens
          path: playtest-out
          retention-days: 14
