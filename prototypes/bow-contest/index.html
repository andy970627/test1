<title>伊薩卡比箭</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@600;900&family=Noto+Sans+TC:wght@400;500&display=swap">
<style>
/* 第一人稱：上方整塊是大廳（three.js），文字介面浮在上面；下方一排實驗開關。單一夜色主題。 */
:root {
  --night: #120e0a;
  --wood: #2a2018;
  --line: #3a2d22;
  --bronze: #b98a4b;
  --lamp: #f0c27a;
  --ash: #d6c8b1;
  --dim: #9a8b75;
  --blood: #d0694d;
  --display: "Noto Serif TC", "Songti TC", serif;
  --body: "Noto Sans TC", "PingFang TC", system-ui, sans-serif;
  --gutter-l: max(16px, env(safe-area-inset-left, 0px));
  --gutter-r: max(16px, env(safe-area-inset-right, 0px));
  color-scheme: dark;
}
[hidden] { display: none !important; }
html, body { margin: 0; background: var(--night); }
body { color: var(--ash); font-family: var(--body); }
.stage {
  position: relative; width: 100%; height: calc(100svh - 56px); min-height: 360px; max-height: 80vw;
  background: #000; overflow: hidden; touch-action: none; user-select: none; -webkit-user-select: none;
}
@media (max-aspect-ratio: 4/5) { .stage { height: 74svh; max-height: none; } }
canvas#cv { display: block; width: 100%; height: 100%; cursor: crosshair; }
.hud { position: absolute; inset: 0; pointer-events: none; }
.top {
  position: absolute; top: 0; left: 0; right: 0; display: flex; justify-content: space-between; align-items: baseline; gap: 12px;
  padding: 12px var(--gutter-r) 0 var(--gutter-l);
}
.title { font-family: var(--display); font-weight: 900; font-size: clamp(20px, 3vw, 28px); color: var(--lamp); letter-spacing: .06em; text-shadow: 0 2px 8px #000; }
.score { font-size: 13px; color: var(--dim); text-shadow: 0 1px 4px #000; white-space: nowrap; }
.msg {
  position: absolute; top: 52px; left: 0; right: 0; margin: 0; text-align: center; font-size: 15px; line-height: 1.6;
  padding: 0 var(--gutter-r) 0 var(--gutter-l); text-shadow: 0 1px 6px #000, 0 0 2px #000; text-wrap: balance;
  transition: opacity .6s;
}
.panel {
  background: rgba(14, 10, 7, .72); border: 1px solid var(--line); border-radius: 4px; padding: 10px 14px;
}
.stringui { position: absolute; left: 50%; top: 92px; transform: translateX(-50%); width: min(420px, calc(100% - 32px)); box-sizing: border-box; }
.stringui p { margin: 0 0 8px; font-size: 14px; text-align: center; }
.bar { position: relative; height: 14px; background: var(--line); }
.bar .zone { position: absolute; top: 0; bottom: 0; left: 40%; width: 20%; background: rgba(240, 194, 122, .35); }
.bar .needle { position: absolute; top: -6px; bottom: -6px; width: 4px; margin-left: -2px; left: 50%; background: var(--lamp); }
.bar .needle.out { background: var(--blood); }
.tension { margin-top: 10px; height: 6px; background: var(--line); }
.tension i, .power i { display: block; height: 100%; width: 0; background: var(--bronze); }
.drawui { position: absolute; left: var(--gutter-l); bottom: 18px; width: 190px; }
.drawui span { display: block; font-size: 13px; color: var(--dim); margin-bottom: 6px; text-shadow: 0 1px 4px #000; }
.power { height: 8px; background: rgba(58, 45, 34, .85); }
.power i.steady { background: var(--lamp); }
.power i.shake { background: var(--blood); }
.hint {
  position: absolute; left: 50%; bottom: 18px; transform: translateX(-50%); margin: 0; font-size: 13px; color: var(--dim);
  text-shadow: 0 1px 4px #000; text-align: center; width: max-content; max-width: calc(100% - 260px);
}
.hold {
  position: absolute; right: var(--gutter-r); bottom: 18px; width: 96px; height: 96px; border-radius: 50%;
  border: 2px solid var(--bronze); background: rgba(42, 32, 24, .78); color: var(--lamp); font: 500 16px var(--body);
  pointer-events: auto; touch-action: none;
}
.hold.on { background: rgba(185, 138, 75, .45); }
.result {
  position: absolute; left: 50%; bottom: 8%; transform: translateX(-50%); width: min(520px, calc(100% - 32px)); box-sizing: border-box;
  text-align: center; pointer-events: auto; padding: 20px 18px;
}
.result h2 { font-family: var(--display); font-weight: 900; font-size: clamp(24px, 4vw, 34px); margin: 0 0 10px; color: var(--blood); letter-spacing: .05em; }
.result.win h2 { color: var(--lamp); }
.result p { margin: 0 0 8px; line-height: 1.6; }
.result .count { color: var(--dim); font-size: 14px; }
.result button {
  margin-top: 8px; font: 500 15px var(--body); color: var(--night); background: var(--lamp); border: 0; padding: 8px 18px; border-radius: 3px; cursor: pointer;
}
:focus-visible { outline: 2px solid var(--lamp); outline-offset: 2px; }
.below { padding: 10px var(--gutter-r) 28px var(--gutter-l); max-width: 1040px; margin: 0 auto; display: grid; gap: 10px; }
fieldset { border: 1px solid var(--line); padding: 8px 14px 10px; margin: 0; display: flex; flex-wrap: wrap; gap: 8px 22px; }
legend { font-family: var(--display); color: var(--bronze); padding: 0 6px; letter-spacing: .12em; font-size: 13px; }
label { display: flex; align-items: center; gap: 6px; font-size: 14px; cursor: pointer; }
select, input { accent-color: var(--bronze); font: inherit; }
select { background: var(--wood); color: var(--ash); border: 1px solid var(--line); padding: 2px 6px; }
.keys { color: var(--dim); font-size: 13px; line-height: 1.7; margin: 0; }
.keys b { color: var(--ash); font-weight: 500; }
.note { color: var(--dim); font-size: 12px; margin: 0; }
@media (max-width: 560px) {
  .msg { font-size: 14px; top: 46px; }
  .stringui { top: 84px; }
  .drawui { width: 140px; }
  .hint { display: none; }
}
</style>

<div class="stage" id="stage">
  <canvas id="cv" aria-label="奧德修斯的大廳：十二把斧頭排成一列"></canvas>
  <div class="hud">
    <div class="top"><span class="title">伊薩卡比箭</span><span class="score" id="score"></span></div>
    <p class="msg" id="msg"></p>
    <div class="stringui panel" id="stringUI" hidden>
      <p id="stringTip">上弦：按住滑鼠，左右移動，讓指針留在亮區</p>
      <div class="bar"><div class="zone"></div><div class="needle" id="needle"></div></div>
      <div class="tension"><i id="tensionBar"></i></div>
    </div>
    <div class="drawui" id="drawUI" hidden><span id="drawLabel">拉弓</span><div class="power"><i id="powerBar"></i></div></div>
    <p class="hint" id="hint"></p>
    <button class="hold" id="holdBtn" type="button" hidden>上弦</button>
    <div class="result panel" id="result" hidden>
      <h2 id="resTitle"></h2>
      <p id="resText"></p>
      <p class="count" id="resCount"></p>
      <button type="button" id="retryBtn">再來一次（R）</button>
    </div>
  </div>
</div>

<div class="below">
  <p class="keys"><b>瞄準</b>：點一下畫面鎖住滑鼠，移動滑鼠看；拉弓時手會放慢、視線會集中。<b>Esc</b> 放開滑鼠。<br>
  <b>上弦</b>：按住滑鼠左右移動，讓指針待在亮區，直到弓彎滿。<b>射箭</b>：按住拉弓（或空白鍵），放開射出。拉滿後有一小段最穩，撐太久手會抖。<b>R</b>：再來一次。<br>
  手機上：手指拖曳畫面瞄準，按住右下的圓鈕上弦或拉弓；上弦時在圓鈕上左右滑。</p>
  <fieldset>
    <legend>實驗開關</legend>
    <label><input type="checkbox" id="optString" checked> 上弦階段</label>
    <label><input type="checkbox" id="optFatigue" checked> 撐久手會抖</label>
    <label><input type="checkbox" id="optGuide"> 彈道輔助線</label>
    <label>斧孔 <select id="optHole"><option value="normal">普通</option><option value="easy">寬鬆</option><option value="hard">嚴格</option></select></label>
  </fieldset>
  <p class="note">試玩用原型。規則（上弦、手晃、彈道、穿孔判定）放在獨立的 rules.js。改開關會從頭開始。</p>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="rules.js"></script>
<script>
(() => {
  const R = window.BowRules, T = R.TUNING, H = T.shootHeight;
  const $ = id => document.getElementById(id);
  const stage = $('stage'), cv = $('cv');
  const ui = {
    score: $('score'), msg: $('msg'), stringUI: $('stringUI'), stringTip: $('stringTip'), needle: $('needle'), tension: $('tensionBar'),
    drawUI: $('drawUI'), drawLabel: $('drawLabel'), power: $('powerBar'), hint: $('hint'), hold: $('holdBtn'),
    result: $('result'), resTitle: $('resTitle'), resText: $('resText'), resCount: $('resCount'), retry: $('retryBtn'),
  };
  const opt = { string: $('optString'), fatigue: $('optFatigue'), guide: $('optGuide'), hole: $('optHole') };
  const DEBUG = /(^|[?#&])debug\b/.test(location.search + location.hash);
  const NOLOCK = DEBUG && /nolock/.test(location.search + location.hash);   // 測試用：不鎖滑鼠
  if (!window.THREE) { ui.msg.textContent = '畫面無法載入。'; return; }

  // ================================================================ 聲音（WebAudio 合成）
  let ac = null, master = null, noiseBuf = null, creak = null;
  function audio() {
    if (!ac) {
      try {
        ac = new (window.AudioContext || window.webkitAudioContext)();
        master = ac.createGain(); master.gain.value = .8; master.connect(ac.destination);
        noiseBuf = ac.createBuffer(1, ac.sampleRate * 3, ac.sampleRate);
        const d = noiseBuf.getChannelData(0); for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
      } catch (e) { ac = null; }
    }
    if (ac && ac.state === 'suspended') ac.resume();
    return ac;
  }
  function env(g, t0, a, peak, dur) {
    g.gain.setValueAtTime(0.0001, t0); g.gain.exponentialRampToValueAtTime(peak, t0 + a);
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
  }
  function osc(type, f, t0, dur, peak, slideTo, dest) {
    const a = ac, o = a.createOscillator(), g = a.createGain();
    o.type = type; o.frequency.setValueAtTime(f, t0);
    if (slideTo) o.frequency.exponentialRampToValueAtTime(slideTo, t0 + dur);
    env(g, t0, .005, peak, dur); o.connect(g).connect(dest || master); o.start(t0); o.stop(t0 + dur + .05);
  }
  function noise(t0, dur, peak, type, freq, q, dest) {
    const a = ac, s = a.createBufferSource(), f = a.createBiquadFilter(), g = a.createGain();
    s.buffer = noiseBuf; f.type = type; f.frequency.value = freq; f.Q.value = q || 1;
    env(g, t0, .004, peak, dur); s.connect(f).connect(g).connect(dest || master);
    s.start(t0, Math.random() * 2); s.stop(t0 + dur + .05);
    return f;
  }
  const sfx = {
    twang() { if (!audio()) return; const t = ac.currentTime; osc('sawtooth', 210, t, .45, .16, 70); osc('triangle', 420, t, .25, .08, 160); noise(t, .08, .25, 'bandpass', 1800, 2); },
    swallow() { if (!audio()) return; const t = ac.currentTime; for (let i = 0; i < 3; i++) osc('sine', 2600 + i * 180, t + i * .13, .11, .06, 3400); },
    thunder() {
      if (!audio()) return; const t = ac.currentTime + .25;
      const f = noise(t, 3.2, .5, 'lowpass', 180, .7); f.frequency.setValueAtTime(380, t); f.frequency.exponentialRampToValueAtTime(70, t + 3);
      noise(t + .35, 2.2, .3, 'lowpass', 110, .7);
    },
    ring(i) {
      if (!audio()) return; const t = ac.currentTime, f = 520 * Math.pow(2, (i % 12) * 2 / 12);
      osc('sine', f, t, 1.3, .07); osc('sine', f * 2.76, t, .6, .025); osc('sine', f * 5.4, t, .25, .012);
    },
    thunk() { if (!audio()) return; const t = ac.currentTime; osc('square', 130, t, .18, .12, 55); noise(t, .12, .35, 'lowpass', 900); osc('sine', 880, t, .5, .03, 860); },
    slip() { if (!audio()) return; const t = ac.currentTime; osc('sawtooth', 300, t, .5, .12, 60); noise(t, .2, .2, 'highpass', 2000); },
    land() { if (!audio()) return; const t = ac.currentTime; noise(t, .25, .25, 'lowpass', 500); osc('triangle', 160, t, .15, .06, 80); },
    laugh() {
      if (!audio()) return; const t0 = ac.currentTime + .15;
      for (let v = 0; v < 5; v++) {
        const base = 150 + Math.random() * 120, start = t0 + v * .18 + Math.random() * .2, n = 5 + (Math.random() * 4 | 0);
        for (let k = 0; k < n; k++) {
          const t = start + k * (.12 + Math.random() * .03);
          const o = ac.createOscillator(), f = ac.createBiquadFilter(), g = ac.createGain();
          o.type = 'sawtooth'; o.frequency.setValueAtTime(base * (1.15 - k * .02), t); o.frequency.exponentialRampToValueAtTime(base * .85, t + .09);
          f.type = 'bandpass'; f.frequency.value = 700 + Math.random() * 300; f.Q.value = 3;
          env(g, t, .01, .05, .1); o.connect(f).connect(g).connect(master); o.start(t); o.stop(t + .14);
        }
      }
    },
    win() { if (!audio()) return; const t = ac.currentTime + .3; [392, 523, 659].forEach((f, i) => osc('sine', f, t + i * .2, 1.6, .06)); },
    crackle() { if (!ac) return; noise(ac.currentTime, .02 + Math.random() * .03, .03 + Math.random() * .04, 'highpass', 1500 + Math.random() * 2000); },
  };
  function setCreak(level) {
    if (!ac) return;
    if (!creak) {
      const s = ac.createBufferSource(), f = ac.createBiquadFilter(), g = ac.createGain();
      s.buffer = noiseBuf; s.loop = true; f.type = 'bandpass'; f.frequency.value = 240; f.Q.value = 6; g.gain.value = 0;
      s.connect(f).connect(g).connect(master); s.start(); creak = { g, f };
    }
    creak.g.gain.setTargetAtTime(level * .12, ac.currentTime, .05);
    creak.f.frequency.setTargetAtTime(200 + level * 220, ac.currentTime, .1);
  }

  // ================================================================ three.js 場景
  const renderer = new THREE.WebGLRenderer({ canvas: cv, antialias: true });
  renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
  renderer.outputEncoding = THREE.sRGBEncoding;
  renderer.toneMapping = THREE.ACESFilmicToneMapping;
  renderer.toneMappingExposure = 1.25;
  renderer.autoClear = false;

  const scene = new THREE.Scene();
  scene.background = new THREE.Color(0x080604);
  scene.fog = new THREE.FogExp2(0x0b0805, 0.028);
  const camera = new THREE.PerspectiveCamera(55, 1, 0.02, 80);
  camera.rotation.order = 'YXZ';

  // 前景（弓與手）用另一台相機，視角固定，不跟著瞄準拉近
  const vScene = new THREE.Scene();
  const vCam = new THREE.PerspectiveCamera(58, 1, 0.01, 5);

  function canvasTex(w, h, draw, repeatX, repeatY) {
    const c = document.createElement('canvas'); c.width = w; c.height = h; draw(c.getContext('2d'), w, h);
    const t = new THREE.CanvasTexture(c); t.encoding = THREE.sRGBEncoding; t.wrapS = t.wrapT = THREE.RepeatWrapping;
    t.repeat.set(repeatX || 1, repeatY || 1); t.anisotropy = 4; return t;
  }
  const rnd = R.createRng(20); // 佈景固定，每次一樣
  const plankTex = canvasTex(512, 512, (g, w, h) => {
    g.fillStyle = '#3a291b'; g.fillRect(0, 0, w, h);
    for (let i = 0; i < 8; i++) {
      const x = i * 64, tone = 40 + rnd() * 22;
      g.fillStyle = `rgb(${tone + 18},${tone + 2},${tone - 14})`; g.fillRect(x + 1, 0, 62, h);
      for (let k = 0; k < 40; k++) { g.fillStyle = `rgba(20,12,6,${.06 + rnd() * .1})`; g.fillRect(x + rnd() * 62, 0, 1 + rnd() * 2, h); }
      g.fillStyle = '#1a120b'; g.fillRect(x, 0, 2, h); g.fillRect(x, (rnd() * h) | 0, 64, 2);
    }
  }, 4, 10);
  const wallTex = canvasTex(256, 256, (g, w, h) => {
    g.fillStyle = '#4a3a2a'; g.fillRect(0, 0, w, h);
    for (let i = 0; i < 2200; i++) { const v = rnd(); g.fillStyle = `rgba(${v > .5 ? '90,72,52' : '24,18,12'},${.12 + rnd() * .2})`; g.fillRect(rnd() * w, rnd() * h, 2 + rnd() * 5, 2 + rnd() * 4); }
    g.fillStyle = 'rgba(0,0,0,.25)'; for (let y = 0; y < h; y += 64) g.fillRect(0, y, w, 3);
  }, 6, 2);
  const glowTex = canvasTex(128, 128, (g, w, h) => {
    const r = g.createRadialGradient(w / 2, h / 2, 0, w / 2, h / 2, w / 2);
    r.addColorStop(0, 'rgba(255,240,200,1)'); r.addColorStop(.25, 'rgba(255,180,90,.8)'); r.addColorStop(.6, 'rgba(220,100,30,.25)'); r.addColorStop(1, 'rgba(200,80,20,0)');
    g.fillStyle = r; g.fillRect(0, 0, w, h);
  });

  const M = {
    floor: new THREE.MeshStandardMaterial({ map: plankTex, roughness: .9 }),
    wall: new THREE.MeshStandardMaterial({ map: wallTex, roughness: 1, color: 0xb8a088 }),
    dark: new THREE.MeshStandardMaterial({ color: 0x1a120c, roughness: 1 }),
    beam: new THREE.MeshStandardMaterial({ color: 0x2b1d12, roughness: .9 }),
    column: new THREE.MeshStandardMaterial({ color: 0x5a2f1c, roughness: .7 }),   // 塗了紅的木柱
    stone: new THREE.MeshStandardMaterial({ color: 0x5a5046, roughness: 1 }),
    earth: new THREE.MeshStandardMaterial({ color: 0x241a11, roughness: 1 }),
    haft: new THREE.MeshStandardMaterial({ color: 0x5b4028, roughness: .8 }),
    bronze: new THREE.MeshStandardMaterial({ color: 0xc08a48, metalness: .55, roughness: .38 }),
    table: new THREE.MeshStandardMaterial({ color: 0x4a321f, roughness: .8 }),
    skin: new THREE.MeshStandardMaterial({ color: 0xa06a48, roughness: .8 }),
    hair: new THREE.MeshStandardMaterial({ color: 0x1d140d, roughness: 1 }),
  };
  const box = (w, h, d, m) => new THREE.Mesh(new THREE.BoxGeometry(w, h, d), m);
  const cyl = (r1, r2, h, m, seg) => new THREE.Mesh(new THREE.CylinderGeometry(r1, r2, h, seg || 12), m);

  // 大廳：x -6 … 6，z +4 … -26
  const HALL_W = 12, Z0 = 4, Z1 = T.doorZ;
  const floor = new THREE.Mesh(new THREE.PlaneGeometry(HALL_W, Z0 - Z1), M.floor);
  floor.rotation.x = -Math.PI / 2; floor.position.set(0, 0, (Z0 + Z1) / 2); scene.add(floor);
  const ceil = new THREE.Mesh(new THREE.PlaneGeometry(HALL_W, Z0 - Z1), M.dark);
  ceil.rotation.x = Math.PI / 2; ceil.position.set(0, 6.5, (Z0 + Z1) / 2); scene.add(ceil);
  for (const sx of [-1, 1]) {
    const w = box(.4, 6.5, Z0 - Z1, M.wall); w.position.set(sx * (HALL_W / 2 + .2), 3.25, (Z0 + Z1) / 2); scene.add(w);
  }
  const back = box(HALL_W, 6.5, .4, M.wall); back.position.set(0, 3.25, Z0 + .2); scene.add(back);
  // 盡頭的門：門外的庭院有火光
  for (const sx of [-1, 1]) { const p = box(5.2, 6.5, .5, M.wall); p.position.set(sx * 3.4, 3.25, Z1 - .25); scene.add(p); }
  const lintel = box(1.6, 3.6, .5, M.wall); lintel.position.set(0, 4.7, Z1 - .25); scene.add(lintel);
  for (const sx of [-1, 1]) { const j = box(.18, 2.9, .6, M.beam); j.position.set(sx * .89, 1.45, Z1 - .25); scene.add(j); }
  const yard = new THREE.Mesh(new THREE.PlaneGeometry(6, 5), new THREE.MeshBasicMaterial({ color: 0x6a3a18, fog: false }));
  yard.position.set(0, 2.2, Z1 - 3.5); scene.add(yard);
  const yardGround = new THREE.Mesh(new THREE.PlaneGeometry(6, 4), new THREE.MeshStandardMaterial({ color: 0x3a2a1a, roughness: 1 }));
  yardGround.rotation.x = -Math.PI / 2; yardGround.position.set(0, 0, Z1 - 2.2); scene.add(yardGround);
  // 屋樑
  for (let z = Z0 - 1; z > Z1; z -= 3) { const b = box(HALL_W, .3, .35, M.beam); b.position.set(0, 6.2, z); scene.add(b); }
  // 柱子
  for (const sx of [-1, 1]) for (const z of [1.5, -4.5, -10.5, -16.5, -22.5]) {
    const c = cyl(.22, .26, 6.3, M.column, 16); c.position.set(sx * 3.7, 3.15, z); scene.add(c);
    const base = cyl(.36, .4, .2, M.stone, 16); base.position.set(sx * 3.7, .1, z); scene.add(base);
    const cap = box(.6, .18, .6, M.beam); cap.position.set(sx * 3.7, 6.2, z); scene.add(cap);
  }
  // 斧頭的溝
  const trenchLen = T.axeCount * T.axeSpacing + 1.4, trenchZ = -(T.axeFirst + (T.axeCount - 1) * T.axeSpacing / 2);
  const trench = new THREE.Mesh(new THREE.PlaneGeometry(.34, trenchLen), new THREE.MeshBasicMaterial({ color: 0x080503 }));
  trench.rotation.x = -Math.PI / 2; trench.position.set(0, .004, trenchZ); scene.add(trench);
  for (const sx of [-1, 1]) { const m = box(.2, .035, trenchLen, M.earth); m.position.set(sx * .27, .018, trenchZ); scene.add(m); }

  // 火光：灶火、油燈、門外
  const flames = [];
  function flame(x, y, z, size, light) {
    const sp = new THREE.Sprite(new THREE.SpriteMaterial({ map: glowTex, blending: THREE.AdditiveBlending, depthWrite: false, transparent: true, fog: false }));

  });
  ui.hold.addEventListener('pointermove', e => {
    if (e.pointerId !== holdT.id) return;
    const dx = e.clientX - holdT.x, dy = e.clientY - holdT.y; holdT.x = e.clientX; holdT.y = e.clientY;
    moveBy(dx * (st.phase === 'string' ? 1.4 : .5), dy * .5, TOUCH_SENS);
  });
  const holdEnd = e => { if (e.pointerId !== holdT.id) return; holdT.id = null; ui.hold.classList.remove('on'); release(); };
  ui.hold.addEventListener('pointerup', holdEnd); ui.hold.addEventListener('pointercancel', holdEnd);
  ui.hold.addEventListener('contextmenu', e => e.preventDefault());
  if (window.matchMedia && matchMedia('(pointer: coarse)').matches) touchUI = true;

  window.addEventListener('keydown', e => {
    if (e.key === 'r' || e.key === 'R') { audio(); newRound(false); }
    else if (e.code === 'Space' && !e.repeat && (locked || document.activeElement === document.body || document.activeElement === cv)) { e.preventDefault(); press(); }
  });
  window.addEventListener('keyup', e => { if (e.code === 'Space') release(); });
  ui.retry.addEventListener('click', () => { audio(); newRound(false); });
  for (const k in opt) opt[k].addEventListener('change', () => { if (k === 'guide') return; newRound(true); });

  function resize() {
    const w = stage.clientWidth, h = stage.clientHeight;
    renderer.setSize(w, h, false);
    camera.aspect = vCam.aspect = w / h;
    // 窄螢幕：前景相機拉寬一點，弓不會擠滿畫面
    vCam.fov = w / h < .8 ? 74 : 58;
    camera.updateProjectionMatrix(); vCam.updateProjectionMatrix();
  }
  new ResizeObserver(resize).observe(stage); resize();

  // ================================================================ 更新
  const SLOW = .22;   // 跟拍時的慢動作
  const easeOut = x => 1 - (1 - x) * (1 - x);
  let poseT = 0;
  function update(dt) {
    st.time += dt;
    const s = st;
    if (s.result && s.result.showAt && s.time >= s.result.showAt) { s.result.showAt = 0; ui.result.hidden = false; refreshHud(); }
    if (msgTimer > 0) { msgTimer -= dt; if (msgTimer <= 0) ui.msg.style.opacity = 0; }

    if (s.phase === 'string' && !s.result) {
      const dx = input.stringDx; input.stringDx = 0;
      R.stepString(s.str, dt, { down: input.down, dx });
      setCreak(input.down ? .3 + s.str.tension * .7 : 0);
      if (s.str.failed) { sfx.slip(); endRound(false, '弓弦滑掉了', '指針離開亮區太久，弓又彈直了。求婚者哄堂大笑。'); }
      else if (s.str.done) {
        strungOnce = true; s.phase = 'aim'; input.down = false; setCreak(0);
        sfx.swallow(); sfx.thunder();
        say('弓弦在指下歌唱，聲音像燕子。宙斯在天上打了一聲雷。求婚者臉色都變了。', 6);
      }
    }
    if (s.phase === 'aim' && !s.flight && !s.result) {
      R.stepDraw(s.draw, dt, { down: input.down, fatigue: opt.fatigue.checked });
      setCreak(s.draw.drawing && s.draw.power < 1 ? .4 : 0);
    } else if (s.phase === 'aim' && !s.draw.drawing) {
      R.stepDraw(s.draw, dt, { down: false, fatigue: true });
    }

    // 視角：拉弓時視線集中（拉近）
    const f = s.flight, d = s.draw;
    let targetFov = 55;
    if (s.phase === 'aim' && !f) targetFov = 55 - 37 * easeOut(d.drawing ? d.power : 0);
    if (f) targetFov = 50;
    s.fov += (targetFov - s.fov) * Math.min(1, dt * (f ? 3 : 8));
    poseT += ((s.phase === 'aim' ? 1 : 0) - poseT) * Math.min(1, dt * 4);

    // 飛行
    if (f && !f.done) {
      f.t = Math.min(f.res.endT, f.t + dt * SLOW);
      while (f.nextEvent < f.res.events.length && f.res.events[f.nextEvent].t <= f.t) {
        const ev = f.res.events[f.nextEvent++]; axes[ev.axe].lit = 1; sfx.ring(ev.axe);
      }
      if (f.t >= f.res.endT) {
        f.done = true; f.doneAt = s.time;
        const k = f.res.stop.kind;
        if (k === 'hit') sfx.thunk(); else if (k === 'short') sfx.land(); else if (k === 'wide') sfx.land();
      }
    }
    if (f && f.done && !s.result && s.time - f.doneAt > (f.res.win ? .9 : .7)) {
      const text = R.describe(f.res);
      if (f.res.win) endRound(true, '十二孔，一箭穿過', text + '大廳裡的笑聲停了。');
      else endRound(false, '沒有成功', text + '求婚者哄堂大笑。');
    }

    // 斧孔發光、求婚者
    axes.forEach(a => { a.rimMat.emissiveIntensity = a.lit * 2.2; a.lit = Math.max(s.flight && s.flight.res.win && s.flight.done ? .35 : 0, a.lit - dt * .35); });
    suitors.forEach(p => {
      p.laugh = Math.max(0, p.laugh - dt * .3);
      const l = p.laugh, b = Math.abs(Math.sin(s.time * p.rate + p.ph));
      p.headG.rotation.x = -.45 * l * b + Math.sin(s.time * .7 + p.ph) * .04;
      p.body.position.y = p.seatY + .03 * l * b;
      p.body.rotation.x = -.12 * l;
    });
    flames.forEach(fl => {
      const k = .85 + .1 * Math.sin(s.time * 9 + fl.ph) + .07 * Math.sin(s.time * 23 + fl.ph * 2) + .05 * (Math.random() - .5);
      fl.sp.scale.set(fl.size * k, fl.size * 1.3 * k, 1);
      if (fl.light) fl.light.intensity = fl.base * (.85 + .2 * k);
    });
    if (Math.random() < dt * 2.5) sfx.crackle();
  }

  // ================================================================ 繪製
  function render(dt) {
    const s = st, d = s.draw, f = s.flight;
    camera.fov = s.fov; camera.updateProjectionMatrix();

    const winView = f && f.done && f.res.win && s.time - f.doneAt > .35;
    if (winView) {
      // 射穿之後切回奧德修斯的眼睛：十二個亮起的孔排成一線
      camera.position.set(0, H, 0);
      camera.rotation.set(aim.pitch * .3, 0, 0, 'YXZ');
      camera.fov = 26; camera.updateProjectionMatrix();
      const ap = R.positionAt(f.shot, f.t); worldArrow.position.set(ap.x, ap.y, ap.z);
    } else if (f) {
      // 跟拍：相機沿著箭的路徑，落後一小段
      const lag = .55 / R.speed(f.shot.power), tc = Math.max(0, f.t - lag);
      const p = R.positionAt(f.shot, tc), v = R.velocityAt(f.shot, Math.max(tc, 0));
      camera.position.set(p.x, p.y + .05, p.z);
      tmpV.set(p.x + v.x, p.y + .05 + v.y, p.z + v.z);
      camera.lookAt(tmpV);
      const ap = R.positionAt(f.shot, f.t), av = R.velocityAt(f.shot, f.t);
      worldArrow.position.set(ap.x, ap.y, ap.z);
      tmpV.set(ap.x - av.x, ap.y - av.y, ap.z - av.z);   // 箭尾方向
      worldArrow.lookAt(tmpV);
      if (f.done && f.res.stop.kind === 'hit') worldArrow.rotation.z += Math.sin((s.time - f.doneAt) * 40) * .002 * Math.max(0, 1 - (s.time - f.doneAt));
    } else {
      const sw = s.phase === 'aim' ? d.sway : { yaw: 0, pitch: 0, x: 0, y: 0 };
      camera.position.set(sw.x, H + sw.y, 0);
      camera.rotation.set(aim.pitch + sw.pitch, aim.yaw + sw.yaw, 0, 'YXZ');
    }

    // 彈道輔助線
    if (opt.guide.checked && s.phase === 'aim' && !f && !s.result) {
      const shot = R.makeShot({ yaw: aim.yaw, pitch: aim.pitch, power: d.drawing ? Math.max(.3, d.power) : 1, sway: d.sway });
      const arr = guideGeo.attributes.position.array;
      for (let i = 0; i < T.axeCount; i++) { const p = R.positionAt(shot, (R.axeZ(i) - shot.origin.z) / shot.vel.z); arr[i * 3] = p.x; arr[i * 3 + 1] = p.y; arr[i * 3 + 2] = p.z; }
      guideGeo.attributes.position.needsUpdate = true; guide.visible = true;
    } else guide.visible = false;

    // 前景
    const tension = s.phase === 'string' ? s.str.tension : 1;
    const pull = s.phase === 'aim' && !f ? easeOut(d.drawing ? d.power : 0) : 0;
    updateViewmodel(poseT, tension, pull, s.phase === 'aim' && !f, s.phase === 'aim' ? d.sway : null, s.time);

    renderer.clear();
    renderer.render(scene, camera);
    if (!f) { renderer.clearDepth(); renderer.render(vScene, vCam); }

    // HUD
    if (s.phase === 'string' && !s.result) {
      const n = R.clamp(s.str.needle, -1, 1);
      ui.needle.style.left = (50 + n * 50) + '%';
      ui.needle.classList.toggle('out', s.str.outTime > 0);
      ui.tension.style.width = (s.str.tension * 100) + '%';
    }
    if (s.phase === 'aim' && !f && !s.result) {
      const shake = d.stage === 'tremble';
      ui.power.style.width = (d.power * 100) + '%';
      ui.power.className = d.stage === 'steady' ? 'steady' : shake ? 'shake' : '';
      ui.drawLabel.textContent = !d.drawing ? '拉弓' : d.stage === 'drawing' ? '拉弓…' : d.stage === 'settling' ? '拉滿了，穩住…' : d.stage === 'steady' ? '最穩的時候' : '手在抖';
    }
  }

  let last = performance.now(), hudTick = 0, paused = false;
  function loop(now) {
    const dt = Math.min(.05, (now - last) / 1000); last = now;
    if (!paused) { update(dt); render(dt); }
    if ((hudTick += dt) > .25) { hudTick = 0; refreshHud(); }
    requestAnimationFrame(loop);
  }

  newRound(true);
  requestAnimationFrame(loop);

  // ================================================================ 除錯（網址帶 ?debug 才有）
  if (DEBUG) {
    window.bowDebug = {
      get state() { return st; }, aim,
      // 固定步長推進遊戲時間（慢機器上測試用）
      advance(sec) { for (let t = 0; t < sec - 1e-9; t += 1 / 60) update(1 / 60); render(1 / 60); return st.phase; },
      pause(on) { paused = !!on; },
      skipString() { if (st.phase === 'string') { st.str.tension = 1; st.str.done = true; } },
      window(power) { return R.solveWindow(power === undefined ? 1 : power, diff()); },
      perfectShot() {
        const w = R.solveWindow(1, diff());
        st.phase = 'aim'; strungOnce = true;
        aim.yaw = w.yawMid; aim.pitch = w.pitchMid;
        st.draw.drawing = true; st.draw.power = 1; st.draw.fullTime = 1.2;
        st.draw.power = 1;
        return fire({ yaw: 0, pitch: 0, x: 0, y: 0 });
      },
      shoot(yaw, pitch, power) {
        st.phase = 'aim'; aim.yaw = yaw; aim.pitch = pitch; st.draw.power = power;
        return fire({ yaw: 0, pitch: 0, x: 0, y: 0 });
      },
    };
  }
})();
</script>
