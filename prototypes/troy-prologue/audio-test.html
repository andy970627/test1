<title>特洛伊聲音試聽</title>
<style>
/* 人工試聽頁：只測 audio.js（RissetAudio），不含規則與畫面。單一夜色主題。 */
:root { --night:#110d0a; --panel:#1b1510; --line:#3a2d22; --ash:#d8cbb6; --dim:#8f8270; --fire:#f2b866; --alarm:#e0663f; }
body { margin:0; background:var(--night); color:var(--ash); font:15px/1.6 "Noto Sans TC", system-ui, sans-serif; }
main { max-width:640px; margin:0 auto; padding:20px 16px 40px; }
h1 { font-size:20px; margin:0 0 4px; color:var(--fire); }
p.note { color:var(--dim); margin:0 0 16px; font-size:13px; }
section { background:var(--panel); border:1px solid var(--line); border-radius:8px; padding:12px 14px; margin-bottom:12px; }
button { background:#2a2018; color:var(--ash); border:1px solid var(--line); border-radius:6px; padding:7px 12px; margin:3px 2px; font:inherit; cursor:pointer; }
button:hover { border-color:var(--fire); }
button.on { background:var(--alarm); color:#140d08; }
label { display:flex; align-items:center; gap:10px; margin:6px 0; }
input[type=range] { flex:1; }
#readout { font:600 22px/1.4 ui-monospace, monospace; }
#bar { height:10px; background:#2a2018; border-radius:5px; overflow:hidden; margin-top:6px; }
#bar i { display:block; height:100%; width:0; background:var(--fire); }
#blind { display:inline-block; min-width:5em; padding:0 8px; border-radius:4px; }
#blind.yes { background:var(--fire); color:#140d08; }
</style>
<main>
  <h1>特洛伊的迴響・聲音試聽</h1>
  <p class="note">Risset 節奏：一直加速卻不會變快；每 10 秒「斷掉」0.5 秒是盲區。低音每 2.4 秒一拍。</p>
  <section>
    <button id="start">開始</button>
    <button id="stop">暫停</button>
    <label>音量 <input id="vol" type="range" min="0" max="1" step="0.01" value="0.8"></label>
    <div id="readout">p = 0.000　<span id="blind">—</span></div>
    <div id="bar"><i></i></div>
    <div class="note" id="info"></div>
  </section>
  <section>
    <label>警戒 alarm <input id="alarm" type="range" min="0" max="1" step="0.01" value="0"> <span id="alarmv">0.00</span></label>
    <button id="hunt">追殺：關</button>
    <label><input id="cover" type="checkbox"> 殘響掩護（鼓聲不中斷，窗開頭重合擊＋餘韻）</label>
    <label>區號 <select id="zone"><option>0</option><option selected>1</option><option>2</option><option>3</option><option>4</option></select>（第 2 區：第一記重合擊加強；低音拍是整局第一次起疑時加強）</label>
    <label>新訊號強調 <input id="introdb" type="range" min="0" max="8" step="0.5" value="4"> <span id="introdbv">4</span> dB（0＝關，設計 7.9）</label>
    <label>窗前變亮 <input id="bright" type="range" min="0" max="6" step="0.5" value="4"> <span id="brightv">4</span> dB（殘響掩護下；0＝關，設計 7.3）</label>
  </section>
  <section>
    <b>加速感試聽（設計 2026-11-11-illusion-not-heard 第 7.3 節，第二輪）</b>
    <label>版本 <select id="ill"><option value="now" selected>現行</option><option value="s3">S3 第一輪（對照）</option><option value="u1">U1 六層、淡到零</option><option value="u2">U2 每條鼓有自己的音</option><option value="u3">U3 加音高上升</option><option value="u4">U4 滾奏衝進重擊</option></select></label>
    <label>循環 <select id="illT"><option value="10" selected>10 秒（原本）</option><option value="12">12 秒（附近沒有衛兵）</option><option value="6">6 秒（危險）</option></select></label>
    <div class="note">選了試聽版會打開殘響掩護（保留最響的一擊）。沒有衛兵、沒有判定，只聽。網址可帶 ?ill=s3|u1|u2|u3|u4&amp;cycle=12|6。</div>
    <div class="note" id="illinfo">—</div>
  </section>
  <section>
    <b>木馬（HORSE_MODE，設計 2026-11-11 方向 A、C2）</b>
    <label><input id="horse" type="checkbox"> 開木馬</label>
    <label><input id="belly" type="checkbox"> 在腹中</label>
    <label>腹中低通 <select id="bellylp"><option value="auto" selected>照規則（在腹中就開）</option><option value="on">強制開</option><option value="off">強制關</option></select></label>
    <label>離木馬 <input id="hdist" type="range" min="0" max="40" step="0.5" value="3"> <span id="hdistv">3</span> 公尺（共鳴只在殘響掩護的一般窗那一擊響）</label>
    <div class="note" id="horseinfo">—</div>
  </section>
  <section id="cues"></section>
</main>
<script src="audio.js"></script>
<script>
(function () {
  var ctx = null, audio = null, hunted = false;
  var $ = function (id) { return document.getElementById(id); };
  var LABEL = { breathIn: '屏息吸氣', breathOut: '憋氣結束', gasp: '喘氣', step: '腳步', latch: '門閂', down: '倒地', bell: '警鐘', blind: '盲區提示', win: '勝利',
    alert: '起疑', caught: '被抓', takedownFail: '暗殺失手', calmOk: '安撫成功', calmBad: '安撫失敗', calmDone: '安撫完成', checkpoint: '檢查點', dash: '衝刺', escape: '甩掉追兵', trapdoor: '暗門',
    alerted: '高度警覺嗡鳴', alertOver: '警覺結束', takedown: '暗殺成功', huntStep: '追殺合拍一步', huntSlip: '甩開一段',
    bellyHush: '腹中踩歪（同伴按肩）', bellyReady: '刻痕亮滿（主題開頭）', trapdoorOpen: '同伴拉開木栓' };
  // 木馬試驗用的假關卡：木馬範圍和規則 buildLevel 的 level.horse 相同（只拿來算距離與方向）
  var HORSE = { x0: 4.5, z0: 13, x1: 12.5, z1: 17 }, HX = (HORSE.x0 + HORSE.x1) / 2, HZ = (HORSE.z0 + HORSE.z1) / 2;

  var ST = {};   // 同一個物件每幀更新：聲音層用「state 換成新物件」判斷換了一局（新訊號強調會重來）
  function state() {
    var T = audio.T, t0 = audio.t0, now = audio.now(), per = audio.CONST.BASS_PERIOD;
    Object.assign(ST, {
      cycle: { T: T, t0: t0, p: audio.phase(), blind: audio.isBlind(), index: Math.floor((now - t0) / T) },
      alarm: +$('alarm').value, hunted: hunted,
      zone: +$('zone').value,
      T: { COVER_MODE: $('cover').checked, BLIND_LEN: 0.6 },   // 聲音層讀 state.T.COVER_MODE 切殘響掩護
      bass: { period: per, nextBeat: t0 + Math.ceil((now - t0) / per) * per }
    });
    // 木馬：開的時候才放 HORSE_MODE、玩家位置、木馬範圍（關的時候和以前一樣，不帶這些欄位）
    if ($('horse').checked) {
      ST.T.HORSE_MODE = true;
      ST.player = { x: HX + (+$('hdist').value), z: HZ, inBelly: $('belly').checked };
      ST.level = { horse: HORSE }; ST.belly = { open: false };
    } else { delete ST.player; delete ST.level; delete ST.belly; }
    return ST;
  }
  // 加速感試聽：版本 → 聲音層 setIllusion；循環長度換了就重建聲音層（試聽頁的循環固定，不跟規則）
  var ILL = { now: {}, s1: { timbre: true }, s2: { bell: true }, s3: { timbre: true, bell: true },   // s1、s2 只留網址相容
    u1: { u: true }, u2: { u: true, pitch: true }, u3: { u: true, pitch: true, rise: true, shep: true }, u4: { u: true, pitch: true, roll: true } };
  function applyIll() { if (audio && audio.setIllusion) audio.setIllusion(ILL[$('ill').value] || null); }
  function build() {
    if (audio && audio.dispose) audio.dispose();
    audio = RissetAudio.createAudio(ctx, { T: +$('illT').value || 10, t0: ctx.currentTime + 0.1 });
    audio.setMaster(+$('vol').value); applyIll();
  }
  (function () {   // 網址參數預選：?ill=s3|u1|u2|u3|u4&cycle=12|6
    var q = new URLSearchParams(location.search), v = q.get('ill'), c = q.get('cycle');
    if (v && ILL[v] && $('ill').querySelector('option[value="' + v + '"]')) { $('ill').value = v; $('cover').checked = true; }
    if (c === '12' || c === '6' || c === '10') $('illT').value = c;
  })();
  $('ill').onchange = function () { if (this.value !== 'now') $('cover').checked = true; applyIll(); };
  $('illT').onchange = function () { if (ctx) build(); };
  $('start').onclick = function () {
    if (!ctx) {
      ctx = new (window.AudioContext || window.webkitAudioContext)();
      build();
      requestAnimationFrame(frame);
    } else audio.resume();
  };
  $('stop').onclick = function () { if (audio) audio.suspend(); };
  $('vol').oninput = function () { if (audio) audio.setMaster(+this.value); };
  $('hdist').oninput = function () { $('hdistv').textContent = this.value; };
  $('bellylp').onchange = function () { if (audio) audio.setBellyLowpass(this.value === 'auto' ? null : this.value === 'on'); };
  $('introdb').oninput = function () { $('introdbv').textContent = this.value; if (audio) audio.CONST.INTRO_BOOST_DB = +this.value; };
  $('bright').oninput = function () { $('brightv').textContent = this.value; if (audio) audio.CONST.COVER_BRIGHT_DB = +this.value; };
  $('alarm').oninput = function () { $('alarmv').textContent = (+this.value).toFixed(2); };
  $('hunt').onclick = function () { hunted = !hunted; this.textContent = '追殺：' + (hunted ? '開' : '關'); this.classList.toggle('on', hunted); };
  Object.keys(LABEL).forEach(function (k) {
    var b = document.createElement('button'); b.textContent = LABEL[k];
    b.onclick = function () { if (audio) audio.cue(k); };
    $('cues').appendChild(b);
  });
  function frame() {
    var s = state(); audio.update(s);
    var p = s.cycle.p;
    $('readout').firstChild.nodeValue = 'p = ' + p.toFixed(3) + '　';
    $('blind').textContent = s.cycle.blind ? '盲區' : '—';
    $('blind').className = s.cycle.blind ? 'yes' : '';
    $('bar').firstChild.style.width = (p * 100).toFixed(1) + '%';
    $('info').textContent = '音訊時間 ' + s.cycle.index + ' 循環・下一個低音 ' + (s.bass.nextBeat - audio.now()).toFixed(2) + ' 秒後';
    if (audio.illusionInfo) {
      var ii = audio.illusionInfo();
      $('illinfo').textContent = '循環 ' + ii.T + ' 秒・最大聲那一層 每分鐘 ' + ii.loudBpm + ' 拍・聽得到的最快（≥ −12 dB）每分鐘 ' + ii.fastBpm + ' 拍・現在聽得到 ' + ii.audible + ' 條鼓（共 ' + ii.layers + ' 層）・結尾那一刻最快那條 ' + ii.endDb + ' dB・各層 ' + ii.layersDb.join(' / ') + ' dB';
    }
    if (audio.horseInfo) {
      var h = audio.horseInfo();
      $('horseinfo').textContent = !h.on ? '木馬開關關著' :
        '離木馬 ' + (h.dist == null ? '—' : h.dist.toFixed(1)) + ' 公尺・這一擊共鳴音量 ' + h.boomGain.toFixed(3) + '（' + h.boomR + ' 公尺外為 0）・腹中低通 ' +
        (h.lowpass ? '開（' + h.lowpassHz + ' Hz 以下）' : '關') + (h.lastBoom ? '・上一聲 ' + h.lastBoom.gain + '（' + h.lastBoom.dist + ' 公尺）' : '');
    }
    requestAnimationFrame(frame);
  }
})();
</script>
