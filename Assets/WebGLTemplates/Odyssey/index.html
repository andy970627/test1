<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, height=device-height, initial-scale=1.0, user-scalable=no">
<title>{{{ PRODUCT_NAME }}}</title>
<style>
  /* 畫布填滿整個頁面（itch.io 的嵌入框多大就多大），不留邊、不出捲軸。 */
  html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #000; }
  #unity-canvas { display: block; width: 100%; height: 100%; background: #000; outline: none; }
  #loading { position: absolute; left: 50%; top: 50%; width: 40%; max-width: 320px; height: 4px;
             transform: translate(-50%, -50%); background: #222; }
  #loading-fill { width: 0; height: 100%; background: #a08a5a; transition: width 0.2s; }
  #warning { position: absolute; left: 0; right: 0; top: 0; color: #fff; font: 14px sans-serif;
             text-align: center; display: none; }
  #warning div { padding: 8px; }
</style>
</head>
<body>
<canvas id="unity-canvas" tabindex="-1"></canvas>
<div id="loading"><div id="loading-fill"></div></div>
<div id="warning"></div>
<script>
  var canvas = document.querySelector("#unity-canvas");
  var loading = document.querySelector("#loading");
  var loadingFill = document.querySelector("#loading-fill");
  var warning = document.querySelector("#warning");

  function showBanner(msg, type) {
    var div = document.createElement("div");
    div.textContent = msg;
    div.style.background = type == "error" ? "#a00" : "#a80";
    warning.appendChild(div);
    warning.style.display = "block";
    if (type != "error")
      setTimeout(function () {
        warning.removeChild(div);
        warning.style.display = warning.children.length ? "block" : "none";
      }, 5000);
  }

  var buildUrl = "Build";
  var config = {
    dataUrl: buildUrl + "/{{{ DATA_FILENAME }}}",
    frameworkUrl: buildUrl + "/{{{ FRAMEWORK_FILENAME }}}",
#if USE_THREADS
    workerUrl: buildUrl + "/{{{ WORKER_FILENAME }}}",
#endif
#if USE_WASM
    codeUrl: buildUrl + "/{{{ CODE_FILENAME }}}",
#endif
#if MEMORY_FILENAME
    memoryUrl: buildUrl + "/{{{ MEMORY_FILENAME }}}",
#endif
#if SYMBOLS_FILENAME
    symbolsUrl: buildUrl + "/{{{ SYMBOLS_FILENAME }}}",
#endif
    streamingAssetsUrl: "StreamingAssets",
    companyName: {{{ JSON.stringify(COMPANY_NAME) }}},
    productName: {{{ JSON.stringify(PRODUCT_NAME) }}},
    productVersion: {{{ JSON.stringify(PRODUCT_VERSION) }}},
    showBanner: showBanner,
  };

  // 效能：高解析度螢幕（Retina、Windows 縮放 125%～200%）預設會用 2～4 倍像素算圖，
  // 回聲著色器每個像素都要跑，網頁版會很卡。預設固定 1 倍；網址加 ?dpr=1.5 可以手動調高。
  var dprParam = parseFloat(new URLSearchParams(location.search).get("dpr"));
  config.devicePixelRatio = dprParam > 0 ? Math.min(dprParam, window.devicePixelRatio || 1) : 1;

  // 點畫面時把鍵盤焦點交給遊戲（itch.io 嵌入框裡不點一下收不到按鍵）。
  canvas.addEventListener("pointerdown", function () { canvas.focus(); });

  var script = document.createElement("script");
  script.src = buildUrl + "/{{{ LOADER_FILENAME }}}";
  script.onload = function () {
    createUnityInstance(canvas, config, function (progress) {
      loadingFill.style.width = 100 * progress + "%";
    }).then(function (unityInstance) {
      loading.style.display = "none";
      canvas.focus();
    }).catch(function (message) {
      showBanner(String(message), "error");
    });
  };
  document.body.appendChild(script);
</script>
</body>
</html>
